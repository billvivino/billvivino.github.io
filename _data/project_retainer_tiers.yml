  form_value: "$2,500 per week — BVT Build Cycle"
  description: "One five-business-day cycle of asynchronous implementation, review, and testing on an agreed workstream. A non-exclusive delivery service, with no hourly billing."
  fixed_price: false

- id: proof-of-concept
  name: Proof of Concept
  range: "$2,500"
  form_value: "$2,500 — Proof of Concept"
  description: "Test one technical idea before committing to a larger build."
